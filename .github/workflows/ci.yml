name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs for the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Core + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native SkiaSharp dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore, build & test Darkness.Tests
        run: dotnet test Darkness.Tests/Darkness.Tests.csproj -p:ParallelizeTestCollections=false --filter "Category!=Generation" --logger "console;verbosity=normal"
